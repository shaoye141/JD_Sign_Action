name: JD Daily Sign

on:
  schedule:
    - cron: '0 20 * * *' # Runs at 20:00
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: Patch jd_sign.js for s_key
        run: |
          cat > patch.js << 'EOF'
          const fs = require('fs');
          let c = fs.readFileSync('jd_sign.js', 'utf8');
          const target = "  fs.writeFileSync(js_path, js_content, 'utf8')";
          const lines = [
            "  js_content = js_content.replace(/(pt_key|pt_pin)=(.+?);/g, '(pt_key|pt_pin|s_key|s_pin)=.+?;')",
            "  js_content = js_content.replace(/pt_pin=(.+?);/g, '(?:pt_pin|s_pin)=(.+?);')",
            target
          ];
          c = c.replace(target, lines.join(String.fromCharCode(10)));
          fs.writeFileSync('jd_sign.js', c, 'utf8');
          console.log('Patched:', c.includes('s_key'));
          EOF
          node patch.js
      - name: Run sign
        env:
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
          JD_DUAL_COOKIE: ${{ secrets.JD_DUAL_COOKIE }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: node jd_sign.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: result.txt
